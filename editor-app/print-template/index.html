<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BDM クラススキル・パッシブ</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-width:1560px;background:#11141d;color:#edf0f4;font-family:"Yu Gothic UI","Meiryo",sans-serif}body{background:radial-gradient(circle at 86% 2%,#363050 0,transparent 32%),radial-gradient(circle at 8% 28%,#222438 0,transparent 31%),#11141d}.sheet{width:1560px;margin:0 auto;padding:58px 64px 74px;position:relative;isolation:isolate}.emblem{position:absolute;top:-92px;right:-18px;width:600px;height:600px;opacity:.4;pointer-events:none;z-index:0}.emblem img{width:100%;height:100%;object-fit:contain}.sheet>:not(.emblem){position:relative;z-index:1}.hero{border-top:1px solid #b9a47f;padding:22px 0 26px}.eyebrow{font-size:14px;letter-spacing:.33em;color:#c6b58f;font-weight:800}.title-line{display:flex;align-items:baseline;gap:24px}.title-line h1{font:700 100px Georgia,serif;letter-spacing:-.045em;margin:0;color:#f1e8f7}.title-line .ja{font-size:38px;font-weight:800;letter-spacing:.1em}.section-head{display:flex;align-items:center;gap:16px;margin:35px 0 15px}.section-head .number{color:#bba5d7;font:italic 30px Georgia,serif}.section-head h2{font-size:27px;margin:0;letter-spacing:.06em}.section-head .line{height:1px;background:linear-gradient(to right,#746a84,transparent);flex:1}.weapons{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}.weapon{padding:26px 27px 24px;background:linear-gradient(135deg,#242333,#1b1e2b);border:1px solid #63576f;border-radius:16px}.weapon-top{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #5a5467;padding-bottom:13px}.weapon-num{font-size:12px;color:#d4b783;letter-spacing:.19em}.weapon-name{font-size:32px;font-weight:900}.weapon-en{font-size:13px;color:#aaa0ba}.passive-block+.passive-block{margin-top:20px;padding-top:16px;border-top:1px solid #746a78}.passive-heading{font-size:20px;font-weight:800;margin-top:17px}.passive-block+.passive-block .passive-heading{margin-top:0}.passive-list{font-size:17px;line-height:1.6;padding-left:23px;margin:12px 0 0}.passive-list li{padding:2px 0}.passive-list li::marker{color:#b396d1}.passive-block+.passive-block li::marker{color:#c4ad80}.group-marker{border-left:5px solid #b29bd2;background:linear-gradient(90deg,#292536,#1b202b);margin:18px 0 11px;border-radius:0 10px 10px 0;padding:17px 22px;font-size:24px;font-weight:800}.group-marker.normal{border-color:#9aabb8;background:linear-gradient(90deg,#25303a,#1b202b);margin-top:34px}.skill{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:stretch;min-height:305px;padding:17px 20px 18px;background:#1a202b;border:1px solid #394657;border-left:4px solid #849caf;border-radius:12px;margin-bottom:9px}.skill.rabam{border-left-color:#c7a3e9;background:linear-gradient(90deg,#242437,#1a202b 60%)}.skill-left{min-width:0;display:flex;flex-direction:column;align-items:flex-start}.skill-identity{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;width:100%;align-items:start}.skill-index{font:italic 22px Georgia,serif;color:#c4abcf;margin-top:3px}.skill-names{text-align:left}.skill-names strong{display:block;font-size:24px;line-height:1.32;overflow-wrap:anywhere}.skill-names small{display:block;font-size:14px;line-height:1.35;color:#a6acb9;margin-top:5px}.icon{width:190px;height:190px;min-width:190px;min-height:190px;border-radius:50%;margin:17px 0 0 48px;border:1px solid #a599b3;background:#444454;display:grid;place-items:center;color:#beb7c8;font-size:13px;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.skill-right{min-width:0;display:flex;flex-direction:column;gap:12px}.skill-facts{display:flex;align-items:center;gap:25px}.metrics{display:flex;flex:0 0 auto;gap:7px}.metric{min-width:72px;text-align:center;border:1px solid #495363;border-radius:7px;background:#222a36;padding:5px 3px 7px}.metric small{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;color:#acb3bf}.metric b{font-size:19px;font-variant-numeric:tabular-nums}.statuses{flex:1;display:flex;align-items:center;justify-content:space-around;gap:15px}.statuses small{font-size:11px;color:#adb7c5;margin-right:7px}.relics,.state-row{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}.relic,.state,.use{font-size:12px;font-weight:800;border-radius:4px;padding:2px 6px;white-space:nowrap}.relic{border:1px solid #87786a;color:#d8bea1;background:#3b332f}.state.active{border:1px solid #4b9a8b;color:#a7e0cf;background:#1d3f3f}.state.inactive{border:1px solid #4b5561;color:#727c8b;background:#252b34;text-decoration:line-through}.use{border:1px solid #a188bb;color:#e5d0fa;background:#3e3152}.dash{color:#69717e}.skill-description{flex:1;padding:4px 0 0}.skill-description ul{font-size:17px;line-height:1.52;padding-left:21px;margin:0}.skill-description li{padding-bottom:5px}.skill-description li::marker{color:#aeb4c1}.made-at{text-align:right;color:#8f99a8;font-size:16px;margin-top:48px}.error{padding:40px;color:#ffc5b9}
    .all-grid{display:grid;grid-template-columns:repeat(10,1170px);width:11700px;margin:0;background:#11141d;align-items:start}.all-cell{width:1170px;overflow:hidden;border:1px solid #4c4658}.all-cell>.sheet{margin:0;transform:scale(.75);transform-origin:top left}
.passive-list,.skill-description ul{list-style:none;padding-left:0}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
html.preview-mode,html.preview-mode body{min-width:0;scrollbar-width:auto;-ms-overflow-style:auto}
html.preview-mode body{padding-top:62px}
html.preview-mode .sheet{zoom:var(--preview-scale,.65)}
html.preview-mode::-webkit-scrollbar,html.preview-mode body::-webkit-scrollbar,html.preview-mode *::-webkit-scrollbar{display:block;width:14px;height:14px}
html.preview-mode::-webkit-scrollbar-track,html.preview-mode body::-webkit-scrollbar-track{background:#0b0e16}
html.preview-mode::-webkit-scrollbar-thumb,html.preview-mode body::-webkit-scrollbar-thumb{background:#77688c;border:3px solid #0b0e16;border-radius:10px}
.preview-toolbar{display:none;position:fixed;z-index:1000;top:14px;right:24px;align-items:center;gap:6px;padding:6px 8px;border:1px solid #5f526e;border-radius:10px;background:rgba(13,16,25,.94);box-shadow:0 10px 28px rgba(0,0,0,.42);font-size:13px}
html.preview-mode .preview-toolbar{display:flex}
.preview-toolbar button{width:34px;height:32px;border:1px solid #6e617e;border-radius:7px;background:#232331;color:#f1e8f7;font-size:19px;line-height:1;cursor:pointer}
.preview-toolbar button:hover{background:#3c3349;border-color:#a28ab9}
.preview-toolbar output{min-width:52px;text-align:center;color:#d8c8e7;font-variant-numeric:tabular-nums;font-weight:700}
  </style>
</head>
<body>
  <div class="preview-toolbar" aria-label="プレビュー倍率">
    <button type="button" id="previewZoomOut" aria-label="縮小">−</button>
    <output id="previewZoomValue" aria-live="polite">65%</output>
    <button type="button" id="previewZoomIn" aria-label="拡大">＋</button>
  </div>
  <main class="sheet" id="sheet"><p class="error">画像データを準備しています。</p></main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeImage=v=>/^(assets\/[A-Za-z0-9_.-]+|file:\/\/\/|data:image\/)/.test(v||'')&&!String(v).includes('..')?v:'';
    const list=items=>'<ul class="passive-list">'+items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
    const passive=(p,w,i)=>'<div class="passive-block">'+(i===0&&p.name===w.name?'':'<div class="passive-heading">'+esc(p.name)+'</div>')+list(p.lines)+'</div>';
    const weapon=(w,i)=>'<article class="weapon"><div class="weapon-top"><span class="weapon-num">'+String(i+1).padStart(2,'0')+' / WEAPON</span><span class="weapon-name">'+esc(w.name)+'</span><span class="weapon-en">'+esc(w.nameEn)+'</span></div>'+w.passives.map((p,j)=>passive(p,w,j)).join('')+'</article>';
    const metric=(label,value)=>'<div class="metric"><small>'+label+'</small><b>'+esc(value??'—')+'</b></div>';
    const state=(label,on)=>'<span class="state '+(on?'active':'inactive')+'">'+label+'</span>';
    const skill=(s,i)=>{const icon=safeImage(s.icon)?'<img src="'+safeImage(s.icon)+'" alt="">':'ICON';const relics=s.relics.length?s.relics.map(t=>'<span class="relic">'+esc(t)+'</span>').join(''):'<span class="dash">—</span>';const uses=(Array.isArray(s.usage)?s.usage:(s.usage?[s.usage]:[])).map(t=>'<span class="use">'+esc(t)+'</span>').join('');const ia=s.ia?metric('IA','〇'):'';return '<article class="skill '+(s.kind==='ラバム'?'rabam':'')+'"><div class="skill-left"><div class="skill-identity"><span class="skill-index">'+esc(s.number||String(i+1).padStart(2,'0'))+'</span><div class="skill-names"><strong>'+esc(s.name)+'</strong></div></div><div class="icon">'+icon+'</div></div><div class="skill-right"><div class="skill-facts"><div class="metrics">'+metric('STACK',s.stack)+metric('CT',s.ct)+metric('HIT',s.hit)+ia+'</div><div class="statuses"><div><small>秘伝</small><div class="relics">'+relics+'</div></div><div><small>適用</small><div class="state-row">'+state('PvP',s.pvp)+state('PvE',s.pve)+uses+'</div></div></div></div><div class="skill-description"><ul>'+s.description.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div></div></article>'};
    function classMarkup(data){if(!data.classCode||!data.className||!data.createdAt||data.weapons?.length!==2||!Array.isArray(data.skills))throw Error('画像用データの基本項目を確認してください');const groups=[];for(const s of data.skills){let g=groups[groups.length-1];if(!g||g.kind!==s.kind){g={kind:s.kind,items:[]};groups.push(g)}g.items.push(s)}return '<div class="emblem" aria-hidden="true">'+(safeImage(data.classIcon)?'<img src="'+safeImage(data.classIcon)+'" alt="">':'')+'</div><header class="hero"><div class="eyebrow">BLACK DESERT MOBILE / CLASS SKILL INDEX</div><div class="title-line"><h1>'+esc(data.classCode)+'</h1><span class="ja">'+esc(data.className)+'</span></div></header><div class="section-head"><span class="number">01</span><h2>武器とパッシブ</h2><div class="line"></div></div><section class="weapons">'+data.weapons.map(weapon).join('')+'</section><div class="section-head"><span class="number">02</span><h2>スキル一覧</h2><div class="line"></div></div>'+groups.map(g=>'<div class="group-marker '+(g.kind==='ラバム'?'':'normal')+'">'+esc(g.kind)+'スキル</div>'+g.items.map(skill).join('')).join('')+'<div class="made-at">'+esc(data.createdAt)+'</div>'}
    function renderClass(data){document.title=data.classCode+' スキル・パッシブ';const root=document.getElementById('sheet');root.className='sheet';root.innerHTML=classMarkup(data);return true}
    async function renderAllClasses(items){if(!Array.isArray(items)||items.length!==30)throw Error('30クラス分の画像データが必要です');document.title='30クラス スキル・パッシブ';const root=document.getElementById('sheet');root.className='all-grid';root.innerHTML=items.map(data=>'<div class="all-cell"><section class="sheet">'+classMarkup(data)+'</section></div>').join('');await document.fonts.ready;await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=img.onerror=resolve})));for(const cell of root.children){const sheet=cell.firstElementChild;cell.style.height=Math.ceil(sheet.scrollHeight*.75)+'px'}return {width:root.scrollWidth,height:root.scrollHeight}}
    let previewScale=.65;
    function setPreviewScale(next){previewScale=Math.max(.4,Math.min(1,Math.round(next*100)/100));document.documentElement.style.setProperty('--preview-scale',previewScale);document.getElementById('previewZoomValue').textContent=Math.round(previewScale*100)+'%'}
    function enablePreview(){document.documentElement.classList.add('preview-mode');setPreviewScale(.65);window.scrollTo({top:0,left:0})}
    document.getElementById('previewZoomOut').addEventListener('click',()=>setPreviewScale(previewScale-.1));
    document.getElementById('previewZoomIn').addEventListener('click',()=>setPreviewScale(previewScale+.1));
    window.renderClass=renderClass;
    window.renderAllClasses=renderAllClasses;
    window.enablePreview=enablePreview;
  </script>
</body>
</html>
